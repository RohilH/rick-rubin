[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rick-rubin"
version = "0.1.0"
description = "Agentic house/EDM production with LLMs, rendered to Ableton Live"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
views = ["matplotlib>=3.7"]
transcribe = ["faster-whisper>=1.0", "torch>=2.2,<2.9", "torchaudio>=2.2,<2.9"]
serum = ["zstandard>=0.22", "cbor2>=5.4", "pedalboard>=0.9", "mido>=1.3"]
logic = ["mido>=1.3", "python-rtmidi>=1.5", "pyobjc-framework-Cocoa>=10", "pyobjc-framework-Quartz>=10", "pyobjc-framework-ApplicationServices>=10"]
all = ["matplotlib>=3.7"]
check = ["ruff>=0.5", "mypy>=1.8"]
dev = ["pytest>=7", "matplotlib>=3.7", "ruff>=0.5", "mypy>=1.8"]

[project.scripts]
rick-rubin = "rick_rubin.cli:main"

[tool.setuptools.packages.find]
include = ["rick_rubin*"]

[tool.setuptools.package-data]
"rick_rubin.live" = ["remote_script/RickRubin/*.py"]
"rick_rubin" = ["py.typed"]
