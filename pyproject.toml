[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ableton-use"
version = "0.1.0"
description = "Agentic house/EDM production with LLMs, rendered to Ableton Live"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
views = ["matplotlib>=3.7"]
agent = ["anthropic>=0.40"]
all = ["matplotlib>=3.7", "anthropic>=0.40"]
dev = ["pytest>=7", "matplotlib>=3.7"]

[project.scripts]
ableton-use = "ableton_use.cli:main"

[tool.setuptools.packages.find]
include = ["ableton_use*"]

[tool.setuptools.package-data]
"ableton_use.live" = ["remote_script/AbletonUse/*.py"]
