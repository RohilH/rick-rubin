# Checks for this song project — run `rick-rubin check .`
[tool.ruff]
line-length = 140
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "B", "UP"]      # syntax errors, undefined/unused names, likely bugs, outdated idioms
ignore = ["E501", "E741"]           # long lines are fine in note data; short names (l, O) too

[tool.mypy]
python_version = "3.10"
files = ["song.py"]
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
